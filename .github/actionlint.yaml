paths:
  .github/workflows/python.yml:
    ignore:
      # not in actionlint yet
      - 'property "workflow_(repository|sha)" is not defined'
  .github/workflows/self-test.yml:
    ignore:
      # GitHub passes `true` to a string input as "true"; actionlint is stricter than GitHub here.
      - 'input "(pylint|ty)" is typed as string by reusable workflow'
