name: Python

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the Linux jobs.
        type: string
        default: ubuntu-latest
      windows:
        description: Also run pytest on a GitHub-hosted Windows runner.
        type: boolean
        default: false
      macos:
        description: Also run pytest on a GitHub-hosted macOS runner.
        type: boolean
        default: false
      ruff-group:
        description: Dependency group holding a locked ruff; empty uses the latest ruff via `uvx`.
        type: string
        default: ''
      python-versions:
        description: JSON list of Python versions for pytest; `[""]` uses the project's own pin.
        type: string
        default: '[""]'
      working-directory:
        type: string
        default: .
      setup:
        description: Bash run before `uv sync` in the pytest job, e.g. to install system packages or `echo VAR=x >> "$GITHUB_ENV"`.
        type: string
        default: ''
      sync-args:
        description: Extra arguments for `uv sync --locked`.
        type: string
        default: ''
      pytest:
        type: boolean
        default: true
      pytest-args:
        type: string
        default: ''
      patch-coverage:
        description: >-
          Percentage of changed lines and branches a PR must cover, merged across the matrix; 0 turns coverage off.
          The report is posted as a PR comment when the caller grants `pull-requests: write`.
        type: number
        default: 100
    secrets:
      CODECOV_TOKEN:
        required: false
      GIT_TOKEN:
        description: Token for cloning private GitHub dependencies.
        required: false

# No workflow-level permissions: jobs inherit the caller's token, so only callers that
# want the patch-coverage comment grant `pull-requests: write`. Requesting it here would
# fail every caller that doesn't.
jobs:
  ruff:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Install locked ruff
        if: inputs.ruff-group != ''
        run: uv sync --locked --only-group ${{ inputs.ruff-group }}

      - name: ruff format
        id: format
        run: ${{ inputs.ruff-group != '' && 'uv run --no-sync' || 'uvx' }} ruff format --check .

      # --no-fix, not --diff: --diff only reports what ruff can fix safely and exits 0 otherwise.
      - name: ruff check
        if: steps.format.outcome == 'success' || steps.format.outcome == 'failure'
        run: ${{ inputs.ruff-group != '' && 'uv run --no-sync' || 'uvx' }} ruff check --no-fix .

  pytest:
    if: inputs.pytest
    name: pytest (${{ matrix.os }}${{ matrix.python && format(', {0}', matrix.python) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["{0}"{1}{2}]', inputs.runner, inputs.windows && ',"windows-latest"' || '', inputs.macos && ',"macos-latest"' || '')) }}
        python: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true

      - name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      # Env-scoped git config instead of `git config --global`, which would
      # persist the token in the home directory of a self-hosted runner.
      - name: Install dependencies
        env:
          GIT_CONFIG_COUNT: ${{ secrets.GIT_TOKEN && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --locked ${{ inputs.sync-args }}

      - name: pytest
        if: inputs.patch-coverage == 0
        run: uv run --no-sync pytest ${{ inputs.pytest-args }}

      # Like `coverage run -m pytest`, but needs no coverage config from the caller: it also
      # measures subprocesses (pytest-xdist workers) and switches pytest-cov off.
      # Paths are recorded absolute; the coverage job maps each leg's coverage-root onto its checkout.
      - name: pytest
        if: inputs.patch-coverage > 0
        run: |
          uv run --no-sync --with 'coverage[toml]>=7.13' python - ${{ inputs.pytest-args }} <<'EOF'
          import importlib.util
          import os
          import sys

          import coverage

          print(os.getcwd(), file=open("coverage-root", "w"))
          cov = coverage.Coverage()
          cov.set_option("run:branch", True)
          cov.set_option("run:parallel", True)
          cov.set_option("run:relative_files", False)
          cov.set_option("run:disable_warnings", ["no-data-collected"])
          os.environ["COVERAGE_PROCESS_CONFIG"] = cov.config.serialize()
          cov.start()
          import pytest

          exit_code = pytest.main(sys.argv[1:] + (["--no-cov"] if importlib.util.find_spec("pytest_cov") else []))
          cov.stop()
          cov.save()
          sys.exit(exit_code)
          EOF

      - name: Upload coverage data
        if: inputs.patch-coverage > 0 && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ inputs.working-directory }}/.coverage.*
            ${{ inputs.working-directory }}/coverage-root
          include-hidden-files: true

      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != '' && hashFiles(format('{0}/coverage.xml', inputs.working-directory)) != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ inputs.working-directory }}/coverage.xml
          flags: ${{ runner.os }}

  coverage:
    needs: pytest
    if: ${{ !cancelled() && inputs.pytest && inputs.patch-coverage > 0 }}
    runs-on: ${{ inputs.runner }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          # diff-cover compares against the base branch, which a shallow clone lacks.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ inputs.working-directory }}/.coverage-legs

      - name: Combine coverage
        id: combine
        shell: uv run --no-project --with coverage python {0}
        run: |
          from pathlib import Path

          import coverage

          # A lone artifact is extracted straight into .coverage-legs, several get a directory each.
          legs = [root.parent for root in Path(".coverage-legs").rglob("coverage-root")]
          cov = coverage.Coverage()
          cov.set_option("paths", {"legs": [".", *(leg.joinpath("coverage-root").read_text().strip() for leg in legs)]})
          cov.combine([str(leg) for leg in legs], strict=True)
          cov.xml_report(outfile="coverage.xml")

      - name: Patch coverage
        id: patch_coverage
        if: github.event_name == 'pull_request'
        run: >-
          uvx 'diff-cover>=10.4' coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --branch-coverage
          --fail-under=${{ inputs.patch-coverage }}
          --format markdown:patch-coverage.md,github-annotations:warning

      - name: Publish patch coverage report
        if: always() && steps.patch_coverage.outcome != 'skipped'
        run: |
          sed -i -e '/^## Diff: /d' -e 's/^#/##/' patch-coverage.md
          cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Without `pull-requests: write` (or on fork PRs) this fails; the gate and step summary still stand.
      - name: Comment patch coverage on PR
        if: always() && steps.patch_coverage.outcome != 'skipped'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: patch-coverage
          path: ${{ inputs.working-directory }}/patch-coverage.md

      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != '' && steps.combine.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ inputs.working-directory }}/coverage.xml
