name: Python

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the Linux jobs.
        type: string
        default: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
      windows:
        description: Also run pytest on a GitHub-hosted Windows runner.
        type: boolean
        default: false
      macos:
        description: Also run pytest on a GitHub-hosted macOS runner.
        type: boolean
        default: false
      ruff-group:
        description: Dependency group holding a locked ruff; empty uses the latest ruff via `uvx`.
        type: string
        default: ''
      pylint:
        description: >-
          `true` runs `pylint --recursive=y .`; any other string replaces the `.`, e.g. `src/ --fail-under=10`.
          Uses the project's locked pylint if it has one.
        type: string
        default: 'false'
      ty:
        description: >-
          `true` runs `ty check`; any other string is appended as its arguments, e.g. `src/`.
          Uses the project's locked ty if it has one.
        type: string
        default: 'false'
      python-versions:
        description: JSON list of Python versions for pytest; `[""]` uses the project's own pin.
        type: string
        default: '[""]'
      working-directory:
        type: string
        default: .
      setup:
        description: Bash run before `uv sync` in the pytest and lint jobs, e.g. to install system packages or `echo VAR=x >> "$GITHUB_ENV"`.
        type: string
        default: ''
      sync-args:
        description: Extra arguments for `uv sync --locked`.
        type: string
        default: ''
      pytest:
        type: boolean
        default: true
      pytest-args:
        type: string
        default: ''
      patch-coverage:
        description: Minimum coverage of what a PR changes (a changed line counts once, each branch on it once more), merged across the matrix; 0 only reports.
        type: number
        default: 100
      total-coverage:
        description: Minimum total coverage of the merged data; 0 leaves it to the project's `[tool.coverage.report] fail_under`.
        type: number
        default: 0
    secrets:
      CODECOV_TOKEN:
        required: false
      GIT_TOKEN:
        description: Token for cloning private GitHub dependencies.
        required: false

jobs:
  ruff:
    runs-on: ${{ inputs.runner }}
    defaults: &defaults
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Install locked ruff
        if: inputs.ruff-group != ''
        run: uv sync --locked --only-group ${{ inputs.ruff-group }}

      - name: ruff format
        id: format
        run: ${{ inputs.ruff-group != '' && 'uv run --no-sync' || 'uvx' }} ruff format --check .

      # --no-fix, not --diff: --diff only reports what ruff can fix safely and exits 0 otherwise.
      - name: ruff check
        if: steps.format.outcome == 'success' || steps.format.outcome == 'failure'
        run: ${{ inputs.ruff-group != '' && 'uv run --no-sync' || 'uvx' }} ruff check --no-fix .

  pylint:
    if: inputs.pylint != 'false'
    runs-on: ${{ inputs.runner }}
    defaults: *defaults
    steps:
      - uses: actions/checkout@v7

      - &setup-uv-lint
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ fromJSON(inputs.python-versions)[0] }}
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true

      - name: Keep the venv out of the tree pylint scans
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

      - &setup
        name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      # Env-scoped git config instead of `git config --global`, which would
      # persist the token in the home directory of a self-hosted runner.
      - &install
        name: Install dependencies
        env:
          GIT_CONFIG_COUNT: ${{ secrets.GIT_TOKEN && '1' || '0' }}
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: uv sync --locked ${{ inputs.sync-args }}

      - name: pylint
        run: uv run --no-sync --with pylint pylint --recursive=y ${{ inputs.pylint == 'true' && '.' || inputs.pylint }}

  ty:
    if: inputs.ty != 'false'
    runs-on: ${{ inputs.runner }}
    defaults: *defaults
    steps:
      - uses: actions/checkout@v7

      - *setup-uv-lint

      - *setup

      - *install

      - name: ty
        run: uv run --no-sync --with ty ty check ${{ inputs.ty != 'true' && inputs.ty || '' }}

  pytest:
    if: inputs.pytest
    name: pytest (${{ matrix.os }}${{ matrix.python && format(', {0}', matrix.python) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(format('["{0}"{1}{2}]', inputs.runner, inputs.windows && ',"windows-latest"' || '', inputs.macos && ',"macos-latest"' || '')) }}
        python: ${{ fromJSON(inputs.python-versions) }}
    runs-on: ${{ matrix.os }}
    defaults: *defaults
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true

      - *setup

      - *install

      - name: pytest
        run: >-
          uv run --no-sync --with pytest --with 'coverage[toml]>=7.13; python_version >= "3.10"' --with 'coverage[toml]'
          https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/scripts/pytest_coverage.py
          ${{ inputs.pytest-args }}

      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ inputs.working-directory }}/.coverage.*
            ${{ inputs.working-directory }}/coverage-root
          include-hidden-files: true

  coverage:
    needs: pytest
    if: ${{ !cancelled() && inputs.pytest }}
    runs-on: ${{ inputs.runner }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults: *defaults
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: ${{ inputs.working-directory }}

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: ${{ inputs.working-directory }}/.coverage-legs

      - name: Combine coverage
        id: combine
        run: uv run https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/scripts/combine_coverage.py

      - name: Patch coverage
        id: patch_coverage
        if: github.event_name == 'pull_request'
        run: >-
          uv run https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/scripts/patch_report.py
          --base origin/${{ github.base_ref }} --min ${{ inputs.patch-coverage }}

      - name: Publish patch coverage report
        if: always() && steps.patch_coverage.outcome != 'skipped'
        run: cat patch-coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Codecov posts its own PR comment; don't add a second one.
      - name: Comment patch coverage on PR
        if: always() && steps.patch_coverage.outcome != 'skipped' && env.CODECOV_TOKEN == ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: patch-coverage
          path: ${{ inputs.working-directory }}/patch-coverage.md

      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != '' && steps.combine.outcome == 'success'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ${{ inputs.working-directory }}/coverage.xml

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        with:
          name: merged-coverage
          path: ${{ inputs.working-directory }}/coverage.xml
          overwrite: true

      - name: Total coverage
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        run: >-
          uvx --from 'coverage[toml]' coverage report --skip-covered --skip-empty
          ${{ inputs.total-coverage > 0 && format('--fail-under={0}', inputs.total-coverage) || '' }}

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+'; then
            echo "::error::PR title is not a Conventional Commits title (e.g. 'fix(parser): handle empty input'): $TITLE"
            exit 1
          fi

  result:
    needs: [ruff, pylint, ty, pytest, coverage, pr-title]
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
