name: Self-test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from actionlint-py actionlint

  python:
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      working-directory: tests/fixture
      windows: true
      macos: true
      python-versions: '["3.12", "3.14"]'
      setup: echo FIXTURE_SETUP=ran >> "$GITHUB_ENV"

  python-ruff-group:
    uses: ./.github/workflows/python.yml
    with:
      working-directory: tests/fixture
      ruff-group: lint
      pylint: test_fixture.py --fail-under=4
      ty: .
      pytest: false
